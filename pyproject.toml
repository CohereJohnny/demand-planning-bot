[project]
name = "demand-planning-bot"
version = "0.1.0"
description = "AI-Assisted Demand Planning MCP Server for Oil & Gas Supply Chain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "north-mcp-python-sdk @ git+https://github.com/cohere-ai/north-mcp-python-sdk.git",
    "cohere>=5.14.0",
    "mcp>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
]
